name: Release and Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: bump
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'

          if echo "$LABELS" | grep -qi '"Major"'; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -qi '"Minor"'; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -qi '"Patch"'; then
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          else
            echo "bump=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Get latest version tag
        if: steps.bump.outputs.bump != 'none'
        id: version
        run: |
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "current=${LATEST#v}" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        if: steps.bump.outputs.bump != 'none'
        id: next
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.version.outputs.current }}"

          case "${{ steps.bump.outputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.bump.outputs.bump != 'none'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Update pom.xml version
        if: steps.bump.outputs.bump != 'none'
        run: mvn versions:set -DnewVersion=${{ steps.next.outputs.version }} -DgenerateBackupPoms=false -q

      - name: Build JAR
        if: steps.bump.outputs.bump != 'none'
        run: mvn package -q -DskipTests

      - name: Create release
        if: steps.bump.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          JAR=$(ls target/jelly-tui-*.jar | grep -v original | head -1)

          gh release create "v${VERSION}" "$JAR" \
            --title "v${VERSION}" \
            --notes "## What's Changed

          - ${PR_TITLE} (#${PR_NUMBER})

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.version.outputs.current }}...v${VERSION}" \
            --latest
