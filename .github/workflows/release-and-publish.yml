name: Release and Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: bump
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'

          if echo "$LABELS" | grep -qi '"Major"'; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -qi '"Minor"'; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -qi '"Patch"'; then
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          else
            echo "bump=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Get latest version tag
        if: steps.bump.outputs.bump != 'none'
        id: version
        run: |
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "current=${LATEST#v}" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        if: steps.bump.outputs.bump != 'none'
        id: next
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.version.outputs.current }}"

          case "${{ steps.bump.outputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.bump.outputs.bump != 'none'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Update pom.xml version
        if: steps.bump.outputs.bump != 'none'
        run: mvn versions:set -DnewVersion=${{ steps.next.outputs.version }} -DgenerateBackupPoms=false -q

      - name: Build JAR
        if: steps.bump.outputs.bump != 'none'
        run: mvn package -q -DskipTests

      - name: Create release
        if: steps.bump.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          JAR=$(ls target/jelly-tui-*.jar | grep -v original | head -1)

          gh release create "v${VERSION}" "$JAR" \
            --title "v${VERSION}" \
            --notes "## What's Changed

          - ${PR_TITLE} (#${PR_NUMBER})

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.version.outputs.current }}...v${VERSION}" \
            --latest

      - name: Update Homebrew formula
        if: steps.bump.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          JAR=$(ls target/jelly-tui-*.jar | grep -v original | head -1)
          SHA=$(shasum -a 256 "$JAR" | awk '{print $1}')

          FORMULA=$(cat <<RUBY
          class JellyTui < Formula
            desc "Terminal Jellyfin client"
            homepage "https://github.com/Luqman2003/jelly-tui"
            url "https://github.com/Luqman2003/jelly-tui/releases/download/v${VERSION}/jelly-tui-${VERSION}.jar"
            sha256 "${SHA}"

            depends_on "openjdk@21"
            depends_on "mpv"

            def install
              libexec.install "jelly-tui-${VERSION}.jar" => "jelly-tui.jar"
              (bin/"jelly-tui").write <<~EOS
                #!/bin/bash
                exec "#{Formula["openjdk@21"].opt_bin}/java" -jar "#{libexec}/jelly-tui.jar" "$@"
              EOS
            end
          end
          RUBY
          )

          FILE_SHA=$(gh api repos/Luqman2003/homebrew-jelly-tui/contents/Formula/jelly-tui.rb --jq '.sha')

          gh api repos/Luqman2003/homebrew-jelly-tui/contents/Formula/jelly-tui.rb \
            -X PUT \
            -f message="Update formula to v${VERSION}" \
            -f content="$(echo "$FORMULA" | base64)" \
            -f sha="$FILE_SHA"
